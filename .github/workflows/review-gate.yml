name: Signed local review

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: signed-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  invalidate:
    name: Invalidate previous review before checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clear prior OK without checking out repository code
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const repo = context.repo;
            let numbers = [];
            if (context.payload.pull_request) numbers = [context.payload.pull_request.number];
            else if (context.payload.issue?.pull_request) numbers = [context.payload.issue.number];
            else if (context.eventName !== 'issue_comment') {
              const prs = await github.paginate(github.rest.pulls.list, { ...repo, state: 'open', per_page: 100 });
              numbers = prs.map(pr => pr.number);
            }
            for (const pull_number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number });
              if (pr.state !== 'open' || !['main', 'develop'].includes(pr.base.ref)) continue;
              await github.rest.repos.createCommitStatus({ ...repo, sha: pr.head.sha,
                context: 'AI Review', state: 'pending', target_url: pr.html_url,
                description: 'Verificador en curso; aprobación previa invalidada' });
            }
  gate:
    name: Verify signed local review
    needs: invalidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted verifier only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify and publish commit status
        run: node scripts/review/gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
